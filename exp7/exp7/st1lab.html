<!DOCTYPE html>
<html>
    
<head>
    <title>temperature convertor</title>
 <style>
    body{
    font-family: Arial;
    text-align: center;
    margin-top: 100px;
 }
 input{
    padding: 10px;
    font-size: 16px;
 }
 button{
    padding: 10px 20px;
    font-size: 16px;
    margin-top: 10px;
 }
 h2{
    margin-top: 20px; 
    color : blue;
 }
 </style>
</head>
<body>
<h1>celcius to fahrenheit convertor</h1>
<input type="number" id="celcius" placeholder="Enter temperature in Celcius">
<br><br>
<button onclick="convertTemp()">Convert</button>
<h2 id="result"></h2>
<script>
function convertTemp() {
    let c = document.getElementById("celcius").value;
    if (c === "") {
       document.getElementById("result").innerText = "please enter a value";
       return ;
    }
    let f = (c * 9/5) + 32;
    document.getElementById("result").innerText = c + "°C=" + f.toFixed(2) + "°F";
}
</script>
</body>
</html>
