<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Page</title>
</head>
<body style="margin:0; font-family:Arial; background:linear-gradient(to right, #4facfe, #00f2fe); height:100vh; display:flex; justify-content:center; align-items:center;">

    <div style="background:#fff; padding:30px; border-radius:15px; width:350px; text-align:center; box-shadow:0 0 10px rgba(0,0,0,0.2);">

        <h2 id="heading">Sample Heading</h2>

        <input id="inputText" type="text" placeholder="Enter new heading"
            style="padding:8px; width:80%; margin-bottom:15px; border-radius:5px; border:1px solid #ccc;">

        <br>

        <button onclick="changeHeading()"
            style="padding:8px 10px; margin:5px; background:#007bff; color:white; border:none; border-radius:5px;">
            Change Heading
        </button>

        <button onclick="changeBackground()"
            style="padding:8px 10px; margin:5px; background:#17a2b8; color:white; border:none; border-radius:5px;">
            Change Background
        </button>

        <br>

        <button onclick="hidePara()"
            style="padding:8px 10px; margin:5px; background:#dc3545; color:white; border:none; border-radius:5px;">
            Hide Paragraph
        </button>

        <button onclick="showPara()"
            style="padding:8px 10px; margin:5px; background:#28a745; color:white; border:none; border-radius:5px;">
            Show Paragraph
        </button>

        <p id="para" style="margin-top:15px;">
            This is a sample paragraph. JavaScript events can dynamically change content.
        </p>

    </div>

    <script>
        function changeHeading() {
            let text = document.getElementById("inputText").value;
            document.getElementById("heading").innerText = text || "Sample Heading";
        }

        function changeBackground() {
            let colors = ["#ff9a9e", "#a18cd1", "#fbc2eb", "#84fab0", "#f6d365"];
            let random = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.background = random;
        }

        function hidePara() {
            document.getElementById("para").style.display = "none";
        }

        function showPara() {
            document.getElementById("para").style.display = "block";
        }
    </script>

</body>
</html>
